name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt
          python3 -m venv /tmp/lint
          /tmp/lint/bin/pip install -r requirements-dev.txt
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.8/scripts/download-actionlint.bash) 1.7.8 /tmp/lint/bin
      - name: Version sync
        run: python3 scripts/sync-version.py --check
      - name: Shell (shellcheck, shfmt)
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files '*.sh')
          mapfile -t all < <(git ls-files '*.sh' '*.bats')
          shellcheck -S style "${scripts[@]}"
          shfmt -i 2 -ci -d "${all[@]}"
      - name: Python (ruff)
        run: |
          /tmp/lint/bin/ruff check lib scripts
          /tmp/lint/bin/ruff format --check lib scripts
      - name: YAML, Markdown, workflows
        run: |
          /tmp/lint/bin/yamllint -s .github .yamllint.yaml .pre-commit-config.yaml
          /tmp/lint/bin/pymarkdown --config .pymarkdown.json scan ./*.md docs .github
          /tmp/lint/bin/actionlint

  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3-pil
      - name: Unit tests
        run: bats tests/helper.bats
      - name: End-to-end (fake Steam install, real helper commands)
        run: bats tests/e2e.bats
      - name: Release build
        run: scripts/build-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
