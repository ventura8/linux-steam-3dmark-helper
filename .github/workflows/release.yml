name: Release

"on":
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag commit must be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"
      - name: Tag must match VERSION, script and changelog; notes must exist
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$(tr -d '[:space:]' < VERSION)" = "$version" ] || { echo "tag/VERSION mismatch" >&2; exit 1; }
          python3 scripts/sync-version.py --check
          test -s "docs/releases/${GITHUB_REF_NAME}.md"
      - name: Test
        run: |
          sudo apt-get update
          sudo apt-get install -y bats python3-pil
          bats tests/
      - name: "Build (reproducible, mtime = tagged commit time)"
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" scripts/build-release.sh
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          files: |
            dist/*.tar.gz
            dist/3dmark-helper.sh
            dist/SHA256SUMS
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: false
